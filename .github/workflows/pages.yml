# Publishes docs/ to GitHub Pages.
#
# This replaces GitHub's built-in "Deploy from a branch" pipeline
# (pages-build-deployment), which cannot be edited and still runs
# actions/checkout@v4 and actions/upload-artifact@v4 — both Node 20 actions,
# forced onto Node 24 since 16 June 2026.
#
# The page in docs/ is generated by src/build.py and
# committed, so there is nothing to build here: the directory is uploaded as it
# stands. No Jekyll, no Ruby, no build step.
#
# Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions".

name: Deploy docs/ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
